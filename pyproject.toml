[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indego-station-impact"
version = "0.1.0"
description = "Estimating the effect of new Indego stations on ridership at nearby existing stations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "duckdb==1.4.4",
    "numpy",
    "scipy",
    "pyproj",
    "pyfixest",
    "matplotlib",
    "PyYAML",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "statsmodels"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
