name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install lint tool
        run: python -m pip install ruff
      - name: Lint
        run: ruff check .
      - name: Check Python syntax
        run: python -m compileall -q src
