name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install audit and test dependencies
        run: python -m pip install ruff pytest pandas duckdb==1.4.4 numpy scipy pyproj PyYAML
      - name: Lint
        run: ruff check .
      - name: Check Python syntax
        run: python -m compileall -q src scripts
      - name: Test synthetic fixtures
        run: python -m pytest -q
        env:
          PYTHONPATH: src
